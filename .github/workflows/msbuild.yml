name: MSBuild

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild (VS2026)
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[18.0,19.0)"

      - name: Show Visual Studio Info
        shell: pwsh
        run: |
          vswhere -latest
          msbuild -version

      - name: Build .slnx Solution
        shell: pwsh
        run: |
          $solution = "${{ env.SOLUTION_FILE_PATH }}/rougee.slnx"

          if (-not (Test-Path $solution)) {
            Write-Host "Solution file not found at $solution"
            Write-Host "Listing files in ${{ env.SOLUTION_FILE_PATH }}:"
            Get-ChildItem -Path "${{ env.SOLUTION_FILE_PATH }}" -Force
            exit 1
          }

          msbuild $solution `
            /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
            /m
